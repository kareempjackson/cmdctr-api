version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Use .env.docker for Docker, .env for local dev
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - '3009:3009'
    depends_on:
      - postgres
      - redis
      - weaviate
    volumes:
      - ./:/usr/src/app
    command: npm run start:dev

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cmdctr
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - '6380:6379'

  weaviate:
    image: semitechnologies/weaviate:1.24.8
    restart: always
    ports:
      - '8080:8080'
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      CLUSTER_HOSTNAME: 'weaviate'
    volumes:
      - weaviate_data:/var/lib/weaviate

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    depends_on:
      - postgres

volumes:
  pgdata:
  weaviate_data:
